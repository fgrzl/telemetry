name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23.5

      - name: Install Dependencies
        run: go mod tidy
      
      - name: Build Package
        run: go build ./...

      - name: Run Tests
        run: go test ./... -v -coverprofile=coverage.out

      - name: Delete Old Workflow Runs
        uses: fgrzl/workflow-cleanup@v1